## Shift-Variant Blur Deblurring for Star Phase Mask Variant 3 with Variant 1 Pretraining and Variant 2 Adapters
# general settings
name: Shift_Variant_V1_V2_ft_V3_Deblurring_NAFNet_Adapters
model_type: AdapterModel
scale: 1
num_gpu: 4 # set to 0 for cpu mode, adjust based on available GPUs
manual_seed: 100

# adapter settings
adapter_training: true
commit_loaded_adapter: true  # false for V2, true for V3 onward
current_domain: 1  # V1=-1 (pure backbone), V2=0, V3=1, V4=2, V5=3, V6=4

# dataset and data loader settings
datasets:
  train:
    name: TrainSet_ShiftVariant_V1_V2_ft_V3_NAFNet_Adapters
    type: Dataset_PairedImage
    dataroot_gt: ./Motion_Deblurring/Datasets/train/ShiftVariant_V3/target_crops
    dataroot_lq: ./Motion_Deblurring/Datasets/train/ShiftVariant_V3/input_crops
    geometric_augs: true

    filename_tmpl: "{}"
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    mini_batch_sizes: [8]  # options: [8], [8,6,4,2] (for progressive training) (High priority)
    iters: [50000] # options: [50000], [100000], [200000], [40000, 20000, 20000, 20000] (for progressive training with 100k iterations) (High priority)
    gt_size: 256 # options: 128, 256 (High priority)
    gt_sizes: [256] # options: [128], [128,160,192,256] (for progressive training) (High priority)

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet_ShiftVariant_V1_V2_ft_V3_NAFNet_Adapters
    type: Dataset_PairedImage
    dataroot_gt: ./Motion_Deblurring/Datasets/val/ShiftVariant_V3/target_crops
    dataroot_lq: ./Motion_Deblurring/Datasets/val/ShiftVariant_V3/input_crops
    io_backend:
      type: disk

# network structures
network_g:
  type: NAFNetAdapters
  img_channel: 3
  width: 32
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 1, 28]
  dec_blk_nums: [1, 1, 1, 1]
  # adapter configuration
  adapter_config:
    bottleneck: 64  # options: 32, 64, 128 (Medium priority)
    dropout: 0.1  # options: 0.0, 0.1, 0.2 (Low priority)
    adapter_scalar: "1.0"  # options: "learnable_scalar", "0.5", "2.0" (Medium priority)
    adapter_layernorm_option: in  # options: out, None (Low priority)
    adapter_option: sequential  # options: parallel, sequential (High priority)
    adapter_momentum: 0.0

# path
path:
  pretrain_network_g: ./experiments/archived_checkpoints/NAFNet_V1_ft_V2_Adapters/net_g_latest.pth
  strict_load_g: false # allows loading checkpoints with missing keys (extra adapter params randomly initialized)
  resume_state: ~

# training settings
train:
  total_iter: 50000  # options: 50000, 100000, 200000 (High priority)
  warmup_iter: -1 # options: -1 (no warm up), 2000 (Low priority)
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [50000]  # options: [50000], [50000, 50000] (for 100k iters), [100000, 100000] (for 200k iters) (Low priority)
    restart_weights: [1]  # options: [1], [1, 1] (for multiple cycles) (Low priority)
    eta_mins: [0.0003]  # options: [0.0003], [0.000001], [0.0003, 0.000001] (for multiple cycles) (Low priority)

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 2e-4  # options: 1e-4, 2e-4, 3e-4 (Medium priority)
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 0  # NAFNet handles padding internally via check_image_size
  val_freq: !!float 2e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
